user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off;

	# Server 헤더 자체를 제거한다 (headers_more 동적 모듈).
	# server_tokens off 는 버전만 지우고 'Server: nginx' 는 남기므로
	# 웹서버 종류가 여전히 노출된다.
	more_clear_headers 'Server';

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	# combined 에 타이밍·전송량을 덧붙인 포맷.
	#
	# 기본 combined 로는 '응답을 만들어 냈다'까지만 알 수 있고, 클라이언트가
	# 실제로 받았는지는 알 수 없다. 2026-09-03 모바일 스플래시 무한 로딩 건에서
	# 이게 문제가 됐다 — 멈춘 요청과 정상 요청의 로그가 `200 137` 로 완전히
	# 동일해서, 전송 실패인지 앱 버그인지 로그만으로 가릴 수 없었다.
	#
	#   rt  $request_time           수신~응답 전송 완료까지 전체. 클라이언트가
	#                               응답을 못 받고 늘어지면 여기가 커진다.
	#   urt $upstream_response_time 백엔드가 쓴 시간. rt 와 벌어지면 원인이
	#                               백엔드가 아니라 클라이언트·네트워크 쪽이다.
	#   bs  $bytes_sent             헤더 포함 실제 전송 바이트($body_bytes_sent 와 대비)
	#   us  $upstream_status        백엔드 상태코드. $status 와 다르면 nginx 가 개입한 것
	#
	# 앞부분은 combined 와 완전히 동일하게 둔다. 위치로 파싱하는 기존 명령
	# ($1=IP, $4=시각, $7=경로, $9=상태)이 그대로 동작해야 한다.
	log_format timed '$remote_addr - $remote_user [$time_local] '
	                 '"$request" $status $body_bytes_sent '
	                 '"$http_referer" "$http_user_agent" '
	                 'rt=$request_time urt=$upstream_response_time '
	                 'bs=$bytes_sent us=$upstream_status';

	access_log /var/log/nginx/access.log timed;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}



spring:
  config:
    activate:
      on-profile: test

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test_database;MODE=MariaDB
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    sql:
      init:
        mode: always


  flyway:
    enabled: false




logging.level:
  root: error
  org.hibernate.SQL: debug
  org.hibernate.orm.jdbc.bind: trace


jwt:
  secret:
    key: "yourTestSecretKeyMustBeLongEnoughForHS256Algorithm"
  access-token:
    expire-time: 6000000   # 100분
  refresh-token:
    expire-time: 86400000 # 24시간


stomp-connect-url: "/ws-stomp"

# 유튜브 라이브 api key ( dummy ) -> 할당량 아껴야 함.
youtube_live-api-key : "dummy"
# 테스트 전용 서비스 키 (운영 값 아님)
service-api:
  keys: "ontology:test-service-key-0123456789abcdef0123456789,wiki-editor:test-wiki-editor-key-0123456789abcdef0123"

# 테스트 전용 웹 SSR 키 (운영 값 아님)
web-ssr:
  keys: "web:test-web-ssr-key-0123456789abcdef012345"

# 테스트는 모두 127.0.0.1 하나에서 호출한다. 비로그인 버킷(분당 100)을 스위트 전체가 나눠 쓰면 429 가 난다.
# 레이트 리밋 자체는 RateLimitWebServerBucketTest 가 필터를 직접 만들어 검증한다.
rate-limit:
  anonymous-requests-per-minute: 100000
  authenticated-requests-per-minute: 100000

# 테스트 전용 문서 계정 (team / test-team-pw, tmoney / test-partner-pw)
docs:
  auth:
    users: "team:$2y$04$2RTNA/WiaAXLDzGFa/tEO.uob.DKJYwKKGTr/KfrGjK5QmWUQNF4C,tmoney:$2y$04$kgraQ2iuXHbFXFbbkztBeeviYCy501qZSA2AuC.Uw2FkJJVM8nbBu"

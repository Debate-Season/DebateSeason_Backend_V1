spring:
  config:
    activate:
      on-profile: test

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test_database;MODE=MariaDB
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    sql:
      init:
        mode: always


  flyway:
    enabled: false




logging.level:
  root: error
  org.hibernate.SQL: debug
  org.hibernate.orm.jdbc.bind: trace


jwt:
  secret:
    key: "yourTestSecretKeyMustBeLongEnoughForHS256Algorithm"
  access-token:
    expire-time: 6000000   # 100분
  refresh-token:
    expire-time: 86400000 # 24시간


stomp-connect-url: "/ws-stomp"

# 유튜브 라이브 api key ( dummy ) -> 할당량 아껴야 함.
youtube_live-api-key : "dummy"
# 테스트 전용 서비스 키 (운영 값 아님)
service-api:
  keys: "ontology:test-service-key-0123456789abcdef0123456789"

# 테스트 전용 웹 SSR 키 (운영 값 아님)
web-ssr:
  keys: "web:test-web-ssr-key-0123456789abcdef012345"

spring:
  profiles:
    default: local
    group:
      local: local,secret

  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100
    open-in-view: false  # OSIV 설정 중요

management:
  endpoints:
    web:
      exposure:
        include: "health"
      base-path: /actuator
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: never
      show-components: always

# 채팅(stomp) 설정
chat:
  message: # 메시지 수 제한
    max-length: 500
    min-length: 1

rate-limit:
  anonymous-requests-per-minute: 100
  authenticated-requests-per-minute: 300
  web-server-requests-per-minute: 3000

# 사람이 아닌 호출자(데이터 파이프라인)용 API 키. 형식: 이름:키,이름:키 (키 32자 이상)
# 교체할 때는 같은 이름으로 새 키를 덧붙였다가, 옮겨 간 뒤 옛 키를 뺀다.
# 비어 있으면 서비스 키 경로가 꺼진다 (모든 서비스 키 요청 401).
service-api:
  keys: ${SERVICE_API_KEYS:}

# 웹 서버(Vercel SSR)용 키. 레이트 리밋 버킷만 바꾼다 (인증·인가 무관). SERVICE_API_KEYS 와 절대 섞지 않는다.
# 형식: web:키 (32자 이상). 비어 있으면 웹 SSR 도 비로그인 IP 버킷을 쓴다.
web-ssr:
  keys: ${WEB_SSR_KEYS:}

# API 문서(Swagger) 로그인 계정. 형식: 이름:bcrypt해시,... (team = 전체, 그 외 = 고객사 그룹만)
# 비어 있으면 문서는 아무도 못 연다 (fail closed). 해시에 $ 가 있어 .env 에는 작은따옴표로 감싼다.
docs:
  auth:
    users: ${DOCS_USERS:}

social:
  kakao:
    audience: 18af8def9522316a9c30d75d997df2b1,eb083b8a5c3da84061858b88f8ff22d6
  apple:
    audience: com.rosyocean.debateseason,com.rosyocean.debateseason.web


